<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Генератор иконок</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: #1a1a1a;
            color: white;
            text-align: center;
        }
        .icon-preview {
            margin: 20px auto;
            background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
            border-radius: 20%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(76, 175, 80, 0.4);
        }
        .icon-192 {
            width: 192px;
            height: 192px;
            font-size: 120px;
        }
        .icon-512 {
            width: 512px;
            height: 512px;
            font-size: 320px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #45a049;
        }
        .instructions {
            max-width: 600px;
            margin: 40px auto;
            text-align: left;
            line-height: 1.8;
        }
        canvas {
            display: none;
        }
    </style>
</head>
<body>
    <h1>💪 Генератор иконок для приложения</h1>

    <h2>Иконка 192x192</h2>
    <div class="icon-preview icon-192" id="icon192">💪</div>
    <button onclick="downloadIcon(192)">Скачать icon-192.png</button>

    <br><br>

    <h2>Иконка 512x512</h2>
    <div class="icon-preview icon-512" id="icon512">💪</div>
    <button onclick="downloadIcon(512)">Скачать icon-512.png</button>

    <div class="instructions">
        <h3>Инструкция:</h3>
        <ol>
            <li>Нажми кнопки выше чтобы скачать иконки</li>
            <li>Положи файлы <code>icon-192.png</code> и <code>icon-512.png</code> в папку <code>Sport</code></li>
            <li>Готово! Можно загружать на GitHub</li>
        </ol>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        function downloadIcon(size) {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = size;
            canvas.height = size;

            // Рисуем градиентный фон
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#4CAF50');
            gradient.addColorStop(1, '#2E7D32');

            ctx.fillStyle = gradient;

            // Закругленные углы
            const radius = size * 0.2;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fill();

            // Рисуем эмодзи
            ctx.font = `${size * 0.6}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('💪', size / 2, size / 2);

            // Скачиваем
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `icon-${size}.png`;
                a.click();
                URL.revokeObjectURL(url);
            });
        }
    </script>
</body>
</html>
